<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topological Geon Weave</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(20,20,20,0.8); padding: 15px; border: 1px solid #333; border-radius: 8px;}
        select { background: #000; color: #00FFCC; border: 1px solid #00FFCC; padding: 5px 10px; font-size: 16px; margin-top: 10px; cursor: pointer;}
    </style>
</head>
<body>
    <div id="ui">
        <h3>Geon Harmonic Weave</h3>
        <select id="orbitalSelect">
            <option value="1s">1s (m=0)</option>
            <option value="2p0">2p (m=0)</option>
            <option value="2p1">2p (m=1)</option>
            <option value="3d0">3d (m=0)</option>
            <option value="4f3">4f (m=3)</option>
        </select>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        let currentLine = null;

        function generateWeave(type) {
            if (currentLine) scene.remove(currentLine);

            const numSteps = 150000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(numSteps * 3);

            let colorHex = 0x00FFFF; // Default Cyan (s)

            for (let i = 0; i < numSteps; i++) {
                // Incommensurate driving frequencies
                const theta = Math.acos(Math.sin(i * 0.00007));
                const phi = i * 0.002313;
                let Y = 1.0;

                // The Kinematic Envelopes
                if (type === '1s') { Y = 1.0; colorHex = 0x00FFFF; }
                else if (type === '2p0') { Y = Math.cos(theta); colorHex = 0x00FF00; }
                else if (type === '2p1') { Y = Math.sin(theta) * Math.cos(phi); colorHex = 0x00FF00; }
                else if (type === '3d0') { Y = 3 * Math.pow(Math.cos(theta), 2) - 1; colorHex = 0xFF00FF; }
                else if (type === '4f3') { Y = Math.pow(Math.sin(theta), 3) * Math.cos(3 * phi); colorHex = 0xFFFF00; }

                // Radius calculation with slight vacuum turbulence
                const r = 15.0 * Math.pow(Math.abs(Y), 1.2) + (Math.sin(i * 0.1) * 0.15);

                // Cartesian conversion
                positions[i * 3] = r * Math.sin(theta) * Math.cos(phi);
                positions[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
                positions[i * 3 + 2] = r * Math.cos(theta);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.LineBasicMaterial({
                color: colorHex, transparent: true, opacity: 0.08,
                blending: THREE.AdditiveBlending, depthWrite: false
            });

            currentLine = new THREE.Line(geometry, material);
            scene.add(currentLine);
        }

        document.getElementById('orbitalSelect').addEventListener('change', (e) => generateWeave(e.target.value));
        generateWeave('1s'); // Init

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
